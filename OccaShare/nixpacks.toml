[providers]
python = "3.12"

[phases.setup]
nixPkgs = ["libGL", "libglvnd", "glib", "zlib", "tesseract", "leptonica", "cmake", "pkg-config", "openblas", "lapack", "libpng", "libjpeg", "gcc"]

[phases.build]
cmds = ["pip install --no-cache-dir --upgrade pip", "pip install --no-cache-dir -r requirements.txt", "pip uninstall -y opencv-python opencv-contrib-python 2>/dev/null || true", "pip install --no-cache-dir opencv-python-headless==4.10.0.84"]
