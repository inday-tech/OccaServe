[phases.setup]
# All system-level dependencies needed for KYC/OCR/Face Recognition
# - tesseract + leptonica: OCR engine for pytesseract
# - cmake: required to compile dlib from source
# - pkg-config: build dependency for dlib
# - openblas: math library for dlib face recognition
# - lapack: linear algebra for dlib
# - libpng, libjpeg: image format support
# - libGL, libglvnd, glib, zlib: OpenCV dependencies
nixPkgs = [
    "python312",
    "libGL", "libglvnd", "glib", "zlib",
    "tesseract", "leptonica",
    "cmake", "pkg-config",
    "openblas", "lapack",
    "libpng", "libjpeg",
    "gcc"
]

[phases.install]
cmds = [
    "python -m venv .venv",
    ".venv/bin/pip install --upgrade pip setuptools wheel",
    ".venv/bin/pip install cmake",
    ".venv/bin/pip install -r requirements.txt",
    ".venv/bin/pip uninstall -y opencv-python opencv-contrib-python",
    ".venv/bin/pip install opencv-python-headless==4.10.0.84"
]

[phases.start]
# Using gunicorn with uvicorn workers for production stability
cmd = "PYTHONPATH=. .venv/bin/gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 600 --workers 2"
