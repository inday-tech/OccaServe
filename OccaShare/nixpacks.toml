[phases.setup]
nixPkgs = ["python311", "tesseract", "libglvnd", "libGL", "glib", "zlib"]
aptPkgs = [
  # Tesseract OCR
  "tesseract-ocr",
  "tesseract-ocr-eng",
  # OpenCV base display/rendering libs
  "libglvnd0",
  "libglib2.0-0",
  "libsm6",
  "libxrender1",
  "libxext6",
  "libxrender-dev",
  # OpenCV parallel processing & math
  "libgomp1",
  "libatlas-base-dev",
  # MediaPipe / protobuf
  "libprotobuf-dev",
  # OpenBLAS (linear algebra — required by MediaPipe & numpy ops)
  "libopenblas-dev",
  # Additional OpenCV runtime deps
  "libavcodec-dev",
  "libavformat-dev",
  "libswscale-dev",
  "libv4l-dev",
  "libgtk-3-0",
  "libpng-dev",
  "libjpeg-dev",
  "libtiff-dev",
  "libwebp-dev"
]

[start]
cmd = "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 600 --workers 2"
