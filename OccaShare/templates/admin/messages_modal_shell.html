<!doctype html>
<html lang="en">
<head>
  {% set wconfig = website_config() %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Messages{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script>window.MAX_UPLOAD_SIZE_MB = {{ wconfig.max_file_size_mb if wconfig and wconfig.max_file_size_mb else 5 }};</script>
  <style>html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#f8fafc;color:#0f172a}body{padding:14px;box-sizing:border-box}</style>
  {% block extra_css %}{% endblock %}
</head>
<body class="embedded-admin-messages">
  {% block content %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>
