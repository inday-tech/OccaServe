<div class="professional-card" style="padding-bottom: 2.5rem; position: relative; overflow: hidden;">
    {% set wconfig = website_config() %}
    {% if wconfig and wconfig.logo_url %}
    <div class="modal-bg-watermark" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.2); width: 90%; height: 90%; background-image: url('{{ wconfig.logo_url }}'); background-repeat: no-repeat; background-position: center; background-size: contain; opacity: 0.15; pointer-events: none; z-index: 0;"></div>
    {% endif %}

    <div class="icon-header" style="position: relative; z-index: 1; background: transparent; box-shadow: none; width: auto; height: auto; display: flex; align-items: center; justify-content: center; margin-bottom: clamp(0.5rem, 2vw, 1rem);">
        <div style="width: 56px; height: 56px; background: rgba(255, 123, 84, 0.1); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #FF7B54;">
            <i class="fas fa-key" style="font-size: 1.4rem;"></i>
        </div>
    </div>

    <h2 class="auth-title" style="position: relative; z-index: 1;">Forgot Password?</h2>
    <p class="auth-subtitle" style="position: relative; z-index: 1;">No worries! Enter your registered email address and we'll send you a link to reset your password.</p>

    <div id="forgotSuccessContainer" class="alert-success" style="{% if not success %}display: none;{% endif %} margin-bottom: 1.5rem; position: relative; z-index: 1;">
        <i class="fas fa-check-circle"></i>
        <span class="success-message">{{ success if success else '' }}</span>
    </div>

    <div id="forgotErrorContainer" class="alert-error" style="{% if not error %}display: none;{% endif %} margin-bottom: 1.5rem; position: relative; z-index: 1;">
        <i class="fas fa-exclamation-circle"></i>
        <span class="error-message">{{ error if error else '' }}</span>
    </div>

    <form action="/auth/forgot-password" method="post" class="auth-form" id="forgotForm" style="position: relative; z-index: 1;">
        <div class="form-group">
            <label for="forgot_email">Email Address</label>
            <div class="input-wrapper">
                <input type="email" id="forgot_email" name="email" class="minimal-input" placeholder="name@example.com" required>
            </div>
        </div>
        <button type="submit" class="btn-primary-action" style="margin-top: 1rem;">
            <span>Send Reset Link</span>
            <i class="fas fa-paper-plane"></i>
        </button>
    </form>

    <div class="auth-footer" style="position: relative; z-index: 1;">
        <p>Remember your password? <a href="#" onclick="openAuthModal('login'); return false;">Sign In</a></p>
    </div>
</div>
