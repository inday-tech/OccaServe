<div class="professional-card">
    <div class="icon-header" style="background: transparent; box-shadow: none; width: auto; height: auto; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem;">
        <div style="width: 60px; height: 60px; background: var(--auth-slate-100); border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: var(--auth-shadow-sm);">
            <i class="fas fa-key" style="font-size: 1.5rem; color: var(--auth-primary);"></i>
        </div>
    </div>

    <h2 class="auth-title">Forgot Password?</h2>
    <p class="auth-subtitle">No worries! Enter your email address and we'll send you a link to reset your password safely.</p>

    {% if success %}
    <div class="alert-success">
        <i class="fas fa-check-circle"></i>
        <span>{{ success }}</span>
    </div>
    {% endif %}

    {% if error %}
    <div class="alert-error">
        <i class="fas fa-exclamation-circle"></i>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/auth/forgot-password" method="post" id="forgotForm">
        <div class="form-group">
            <label for="forgot_email">Email Address</label>
            <div class="input-wrapper">
                <input type="email" id="forgot_email" name="email" class="minimal-input" required
                    placeholder="name@example.com">
            </div>
        </div>
        <button type="submit" class="btn-primary-action" style="margin-top: 1rem;">
            <span>Send Reset Instructions</span>
            <i class="fas fa-paper-plane"></i>
        </button>
    </form>

    <div class="auth-footer">
        <p>Remember your password? <a href="#" onclick="openAuthModal('login'); return false;">Sign In</a></p>
    </div>
</div>
