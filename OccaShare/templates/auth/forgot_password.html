{% set nav_page = 'login' %}
{% extends "landing_base.html" %}

{% block title %}Forgot Password - OccaServe{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='/css/auth/forgot_password.css') }}">
<script>
    // Seamless modal redirect: open in popup modal
    if (window.location.pathname === '/auth/forgot-password') {
        window.location.replace('/?auth_modal=forgot');
    }
</script>
{% endblock %}

{% block content %}
<div class="main-content-wrap">
    <div class="auth-container">
        {% include "auth/components/forgot_password_form.html" %}
    </div>
</div>
{% endblock %}
