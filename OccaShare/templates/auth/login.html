{% set nav_page = 'login' %}
{% extends "landing_base.html" %}

{% block title %}Login - OccaServe{% endblock %}

{% block head %}
<style>
    .main-content-wrap {
        padding: 5rem 0;
        background: #f8fafc;
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .auth-container {
        width: 100%;
        max-width: 480px;
        padding: 20px;
    }
    /* standalone page specifics */
    .auth-container .professional-card {
        background: #fff !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1) !important;
        border: 1px solid #e2e8f0 !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="main-content-wrap">
    <div class="auth-container">
        {% include "auth/components/login_form.html" %}
    </div>
</div>
{% endblock %}
