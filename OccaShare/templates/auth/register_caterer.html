{% set nav_page = 'register' %}
{% extends "landing_base.html" %}

{% block title %}Caterer Registration - OccaServe{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<style>
    .main-content-wrap {
        padding-top: 100px;
        padding-bottom: 100px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
        background-attachment: fixed;
        position: relative;
    }

    .auth-container {
        width: 100%;
        max-width: 800px;
        padding: 1.5rem;
    }

    .professional-card {
        background: rgba(255, 255, 255, 0.98);
        border-radius: 2rem;
        padding: 3.5rem;
        box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12);
        border: 1px solid rgba(30, 41, 59, 0.05);
        backdrop-filter: blur(8px);
    }
    
    /* Responsive spacing adaptation */
    @media (max-width: 768px) {
        .professional-card {
            padding: 2.5rem 1.5rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="main-content-wrap">
    <div class="auth-container">
        <div class="professional-card">
            {% include "auth/components/register_caterer_form.html" %}
        </div>
    </div>
</div>
{% endblock %}
