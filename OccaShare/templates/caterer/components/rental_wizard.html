<!-- Add Rental Wizard Modal -->
<div id="rentalWizardModal" class="occ-modal-overlay" style="display: none; z-index: 99999;">
    <div class="occ-modal-box sz-lg occ-content-pop" style="max-width: 700px; padding: 0;">
        <div class="occ-modal-header glass-header" style="padding: 1.5rem 2rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 class="occ-modal-title" style="margin:0;"><i class="fas fa-chair"></i> Add New Equipment / Rental</h3>
            </div>
            <button type="button" onclick="closeWizard('rentalWizardModal')" class="occ-modal-close" style="background: none; border: none; font-size: 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <!-- Visual Stepper Section (2 Steps) -->
        <div style="padding: 1.25rem 3rem; background: #ffffff; border-bottom: 1px solid #e2e8f0;">
            <div style="display: flex; justify-content: space-between; position: relative; width: 100%;">
                <div style="position: absolute; top: 12px; left: 0; right: 0; height: 2px; background: #e2e8f0; z-index: 1;"></div>
                <div id="rentalStepperLine" style="position: absolute; top: 12px; left: 0; width: 0%; height: 2px; background: var(--primary-color); z-index: 2; transition: width 0.3s ease;"></div>
                
                <div class="rental-step-marker" data-step="1" style="position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <div class="step-circle" style="width: 26px; height: 26px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border: 2px solid white; box-shadow: 0 0 0 2px var(--primary-color); transition: all 0.3s;">1</div>
                    <span style="font-size: 10px; font-weight: 700; color: var(--primary-color); text-transform: uppercase;">Basic Info &amp; Pricing</span>
                </div>
                <div class="rental-step-marker" data-step="2" style="position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <div class="step-circle" style="width: 26px; height: 26px; border-radius: 50%; background: #e2e8f0; color: #64748b; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border: 2px solid white; box-shadow: 0 0 0 2px #e2e8f0; transition: all 0.3s;">2</div>
                    <span style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase;">Inclusions</span>
                </div>
            </div>
        </div>

        <form id="rentalWizardForm" action="/caterer/api/services/add-rental-wizard" method="POST" enctype="multipart/form-data" novalidate style="display: flex; flex-direction: column; max-height: 75vh;">
            <input type="hidden" name="details_json" id="rentalDetailsJson">
            <input type="hidden" name="status" id="rentalStatusInput" value="Draft">
            <input type="hidden" name="category" value="Equipment">

            <div class="occ-modal-body" style="flex: 1; overflow-y: auto; padding: 1.75rem 2rem;">
                
                <!-- STEP 1: Basic Info & Pricing -->
                <div class="wizard-step active" id="rentalStep1">
                    <div class="form-group-pro" style="margin-bottom: 1rem;">
                        <label>Item Name *</label>
                        <input type="text" name="name" class="control-pro" placeholder="e.g. Round Table, Monoblock Chairs, Tent" required>
                    </div>

                    <div class="form-row-pro" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem;">
                        <div class="form-group-pro">
                            <label>Rental Price (₱) *</label>
                            <input type="number" name="price" class="control-pro" placeholder="0.00" required min="1" step="0.01">
                        </div>
                        <div class="form-group-pro">
                            <label>Pricing Unit *</label>
                            <select name="unit_type" class="control-pro" required>
                                <option value="Per Piece">Per Piece</option>
                                <option value="Per Set">Per Set</option>
                                <option value="Per Day">Per Day</option>
                                <option value="Per Event">Per Event</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group-pro" style="margin-bottom: 1rem;">
                        <label>Available Quantity / Stock *</label>
                        <input type="number" name="total_stock" class="control-pro" placeholder="e.g. 50" required min="1" value="50">
                    </div>
                    
                    <div class="form-group-pro" style="margin-bottom: 1rem;">
                        <label>Description <span style="font-weight: 400; color: #94a3b8; text-transform: none;">(Optional)</span></label>
                        <textarea name="description" class="control-pro" placeholder="Describe the item, condition, dimensions..." style="height: 80px;"></textarea>
                    </div>

                    <div class="form-group-pro">
                        <label>Main Photo <span style="font-weight: 400; color: #94a3b8; text-transform: none;">(Optional)</span></label>
                        <div class="photo-dropzone-pro" id="rentalPhotoDropzone" onclick="document.getElementById('rentalImageInput').click()" style="cursor: pointer;">
                            <i class="fas fa-camera"></i>
                            <span>Upload photo</span>
                            <input type="file" name="image" id="rentalImageInput" accept="image/*" style="display: none;" onchange="previewRentalImage(event)">
                        </div>
                        <div id="rentalImagePreviewContainer" class="preview-box-pro" style="display: none;">
                            <img id="rentalImagePreview" src="" class="img-preview-pro" alt="Preview">
                            <button type="button" class="btn-remove-img-pro" onclick="removeRentalImage()"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                </div>

                <!-- STEP 2: Inclusions (Simplified) -->
                <div class="wizard-step" id="rentalStep2" style="display: none;">
                    <div style="background: #f8fafc; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid #e2e8f0;">
                        <h4 style="font-weight: 700; color: #1e293b; margin-bottom: 0.35rem; font-size: 1rem;">What's Included?</h4>
                        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">List items included when renting this item (e.g. 10 Chairs, Table Cloth, Chafing Dish).</p>
                        
                        <div id="rentalInclusionsList" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem;">
                            <!-- Inclusions injected here -->
                        </div>
                        
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="addIncName" class="control-pro" placeholder="Included Item (e.g. 10 Chairs, Table Cloth)" style="flex: 1;" onkeydown="if(event.key==='Enter'){event.preventDefault();addRentalInclusion();}">
                            <button type="button" class="btn-primary-pro" onclick="addRentalInclusion()" style="padding: 0.6rem 1.25rem; display: inline-flex; align-items: center; gap: 6px;"><i class="fas fa-plus"></i> <span>Add</span></button>
                        </div>
                    </div>
                </div>

            </div>

            <div class="occ-modal-footer" style="padding: 1rem 2rem; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button type="button" id="rentalBtnPrev" class="btn-secondary-pro" style="display: none; padding: 0.65rem 1.15rem;" onclick="navigateRentalWizard(-1)" title="Back"><i class="fas fa-arrow-left" style="margin-right: 4px;"></i> Back</button>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button type="button" id="rentalBtnDraft" class="btn-secondary-pro" style="display: none; border: none; background: transparent; color: #64748b; font-weight: 600; padding: 0.5rem 1rem;" onclick="submitRentalWizard('Draft')" title="Save as Draft"><i class="fas fa-save" style="margin-right: 4px;"></i> Save Draft</button>
                    <button type="button" id="rentalBtnNext" class="btn-primary-pro" style="padding: 0.65rem 1.25rem; display: inline-flex; align-items: center; gap: 6px;" onclick="navigateRentalWizard(1)" title="Next Step"><span>Next: Inclusions</span> <i class="fas fa-arrow-right"></i></button>
                    <button type="button" id="rentalBtnPublish" class="btn-primary-pro" style="display: none; background: #10b981; border-color: #10b981; padding: 0.65rem 1.35rem; display: inline-flex; align-items: center; gap: 6px;" onclick="submitRentalWizard('Published')" title="Publish"><i class="fas fa-check"></i> <span>Save Equipment</span></button>
                </div>
            </div>
        </form>
    </div>
</div>
