<!-- Add Service Wizard Modal -->
<div id="serviceWizardModal" class="occ-modal-overlay" style="display: none; z-index: 99999;">
    <div class="occ-modal-box sz-lg occ-content-pop" style="max-width: 700px; padding: 0;">
        <div class="occ-modal-header glass-header" style="padding: 1.5rem 2rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 class="occ-modal-title" style="margin:0;"><i class="fas fa-concierge-bell"></i> Add New Service</h3>
            </div>
            <button type="button" onclick="closeWizard('serviceWizardModal')" class="occ-modal-close" style="background: none; border: none; font-size: 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <!-- Visual Stepper Section (2 Steps) -->
        <div style="padding: 1.25rem 3rem; background: #ffffff; border-bottom: 1px solid #e2e8f0;">
            <div style="display: flex; justify-content: space-between; position: relative; width: 100%;">
                <div style="position: absolute; top: 12px; left: 0; right: 0; height: 2px; background: #e2e8f0; z-index: 1;"></div>
                <div id="serviceStepperLine" style="position: absolute; top: 12px; left: 0; width: 0%; height: 2px; background: var(--primary-color); z-index: 2; transition: width 0.3s ease;"></div>
                
                <div class="service-step-marker" data-step="1" style="position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <div class="step-circle" style="width: 26px; height: 26px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border: 2px solid white; box-shadow: 0 0 0 2px var(--primary-color); transition: all 0.3s;">1</div>
                    <span style="font-size: 10px; font-weight: 700; color: var(--primary-color); text-transform: uppercase;">Basic Info &amp; Pricing</span>
                </div>
                <div class="service-step-marker" data-step="2" style="position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <div class="step-circle" style="width: 26px; height: 26px; border-radius: 50%; background: #e2e8f0; color: #64748b; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border: 2px solid white; box-shadow: 0 0 0 2px #e2e8f0; transition: all 0.3s;">2</div>
                    <span style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase;">Inclusions</span>
                </div>
            </div>
        </div>

        <form id="serviceWizardForm" action="/caterer/api/services/add-service-wizard" method="POST" enctype="multipart/form-data" novalidate style="display: flex; flex-direction: column; max-height: 75vh;">
            <input type="hidden" name="details_json" id="serviceDetailsJson">
            <input type="hidden" name="status" id="serviceStatusInput" value="Draft">
            <input type="hidden" name="category" value="Service">
            <input type="hidden" name="base_duration_hours" value="3">

            <div class="occ-modal-body" style="flex: 1; overflow-y: auto; padding: 1.75rem 2rem;">
                
                <!-- STEP 1: Basic Info & Pricing -->
                <div class="wizard-step active" id="serviceStep1">
                    <div class="form-group-pro" style="margin-bottom: 1rem;">
                        <label>Service Name *</label>
                        <input type="text" name="name" class="control-pro" placeholder="e.g. Acoustic Band, Photobooth, Event Staff" required>
                    </div>

                    <div class="form-row-pro" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem;">
                        <div class="form-group-pro">
                            <label>Base / Starting Price (₱) *</label>
                            <input type="number" name="price" class="control-pro" placeholder="0.00" required min="1" step="0.01">
                        </div>
                        <div class="form-group-pro">
                            <label>Pricing Type *</label>
                            <select name="unit_type" class="control-pro" required>
                                <option value="Per Event">Per Event (Fixed)</option>
                                <option value="Per Hour">Per Hour</option>
                                <option value="Starting Price">Starting Price (Custom Quote)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group-pro" style="margin-bottom: 1rem;">
                        <label>Description <span style="font-weight: 400; color: #94a3b8; text-transform: none;">(Optional)</span></label>
                        <textarea name="description" class="control-pro" placeholder="Describe the service, what makes it special..." style="height: 80px;"></textarea>
                    </div>

                    <div class="form-group-pro">
                        <label>Main Photo / Cover <span style="font-weight: 400; color: #94a3b8; text-transform: none;">(Optional)</span></label>
                        <div class="photo-dropzone-pro" id="servicePhotoDropzone" onclick="document.getElementById('serviceImageInput').click()" style="cursor: pointer;">
                            <i class="fas fa-camera"></i>
                            <span>Upload photo</span>
                            <input type="file" name="image" id="serviceImageInput" accept="image/*" style="display: none;" onchange="previewServiceImage(event)">
                        </div>
                        <div id="serviceImagePreviewContainer" class="preview-box-pro" style="display: none;">
                            <img id="serviceImagePreview" src="" class="img-preview-pro" alt="Preview">
                            <button type="button" class="btn-remove-img-pro" onclick="removeServiceImage()"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                </div>

                <!-- STEP 2: Service Inclusions (Simplified) -->
                <div class="wizard-step" id="serviceStep2" style="display: none;">
                    <div style="background: #f8fafc; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid #e2e8f0;">
                        <h4 style="font-weight: 700; color: #1e293b; margin-bottom: 0.35rem; font-size: 1rem;">What's Included?</h4>
                        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">List items included in this service (e.g. Buffet Setup, Event Staff, Balloon Decoration).</p>
                        
                        <div id="serviceInclusionsList" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem;">
                            <!-- Inclusions injected here -->
                        </div>
                        
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="addSvcIncName" class="control-pro" placeholder="Included Item (e.g. Event Staff, Buffet Setup)" style="flex: 1;" onkeydown="if(event.key==='Enter'){event.preventDefault();addServiceInclusion();}">
                            <button type="button" class="btn-primary-pro" onclick="addServiceInclusion()" style="padding: 0.6rem 1.25rem; display: inline-flex; align-items: center; gap: 6px;"><i class="fas fa-plus"></i> <span>Add</span></button>
                        </div>
                    </div>
                </div>

            </div>

            <div class="occ-modal-footer" style="padding: 1rem 2rem; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button type="button" id="serviceBtnPrev" class="btn-secondary-pro" style="display: none; padding: 0.65rem 1.15rem;" onclick="navigateServiceWizard(-1)" title="Back"><i class="fas fa-arrow-left" style="margin-right: 4px;"></i> Back</button>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button type="button" id="serviceBtnDraft" class="btn-secondary-pro" style="display: none; border: none; background: transparent; color: #64748b; font-weight: 600; padding: 0.5rem 1rem;" onclick="submitServiceWizard('Draft')" title="Save as Draft"><i class="fas fa-save" style="margin-right: 4px;"></i> Save Draft</button>
                    <button type="button" id="serviceBtnNext" class="btn-primary-pro" style="padding: 0.65rem 1.25rem; display: inline-flex; align-items: center; gap: 6px;" onclick="navigateServiceWizard(1)" title="Next Step"><span>Next: Inclusions</span> <i class="fas fa-arrow-right"></i></button>
                    <button type="button" id="serviceBtnPublish" class="btn-primary-pro" style="display: none; background: #10b981; border-color: #10b981; padding: 0.65rem 1.35rem; display: inline-flex; align-items: center; gap: 6px;" onclick="submitServiceWizard('Published')" title="Publish"><i class="fas fa-check"></i> <span>Save Service</span></button>
                </div>
            </div>
        </form>
    </div>
</div>
