<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>{% block title %}Modal View{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Assets -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/caterer/layout.css') }}?v=12.9">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/shared/dashboard_premium.css') }}?v=12.9">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/global/global.css') }}?v=12.9">
    
    <style>
        :root {
            {% if user and user.caterer_profile %}
            --primary-color: {{ user.caterer_profile.primary_color or 'var(--primary-color)' }};
            --primary-color-rgb: {{ (user.caterer_profile.primary_color or 'var(--primary-color)') | hex_to_rgb }};
            --secondary-color: {{ user.caterer_profile.secondary_color or '#2D4059' }};
            --secondary-color-rgb: {{ (user.caterer_profile.secondary_color or '#2D4059') | hex_to_rgb }};
            --accent-color: {{ user.caterer_profile.accent_color or '#FFB26B' }};
            --accent-color-rgb: {{ (user.caterer_profile.accent_color or '#FFB26B') | hex_to_rgb }};
            --font-family: {{ (user.caterer_profile.font_family or "'Poppins', sans-serif") | safe }};
            --border-radius: {{ user.caterer_profile.border_radius or 12 }}px;
            {% else %}
            --primary-color: var(--primary-color);
            --primary-color-rgb: 255, 123, 84;
            --secondary-color: #2D4059;
            --secondary-color-rgb: 45, 64, 89;
            --accent-color: #FFB26B;
            --accent-color-rgb: 255, 178, 107;
            --font-family: 'Poppins', sans-serif;
            --border-radius: 12px;
            {% endif %}
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            font-family: var(--font-family) !important;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6, p, a, span, div, button, input {
            font-family: var(--font-family) !important;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
