<style>
    :root {
        --chat-primary: var(--primary-color, #10b981);
        --chat-secondary: var(--secondary-color, #1e293b);
        --chat-bg: #ffffff;
        --chat-text: #334155;
        --chat-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    .floating-chat-trigger {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        width: 60px;
        height: 60px;
        background: var(--chat-primary);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: var(--chat-shadow);
        z-index: 99999;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: none;
        outline: none;
        pointer-events: all;
    }

    .floating-chat-trigger:hover {
        transform: scale(1.1);
    }

    .floating-chat-trigger i {
        font-size: 1.5rem;
    }

    .chat-unread-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: var(--chat-primary);
        color: white;
        font-size: 0.7rem;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border-radius: 99px;
        display: none; /* Hidden by default */
        align-items: center;
        justify-content: center;
        font-weight: 700;
        border: 2px solid white;
    }

    .chat-container-floating {
        position: fixed;
        bottom: 6.5rem;
        right: 2rem;
        width: 380px;
        height: 550px;
        background: var(--chat-bg);
        border-radius: 1rem;
        box-shadow: 0 10px 40px -4px rgba(0,0,0,0.1), 0 8px 16px -4px rgba(0,0,0,0.06);
        display: none; /* Initially hidden */
        flex-direction: column;
        overflow: hidden;
        z-index: 99998;
        transform-origin: bottom right;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid #f1f5f9;
        max-height: calc(100vh - 8rem);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .chat-container-floating.active {
        display: flex;
        animation: chatSlideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes chatSlideUp {
        from { opacity: 0; transform: scale(0.9) translateY(40px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .chat-floating-header {
        background: var(--chat-primary);
        color: white;
        padding: 0 1.5rem;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .chat-floating-header h3 {
        font-size: 1.15rem;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.01em;
    }

    .chat-floating-header .close-chat {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0.9;
        border-radius: 12px;
        transition: background 0.2s;
        margin-right: -0.5rem;
    }

    .chat-floating-header .close-chat:hover { 
        background: rgba(255,255,255,0.15);
        opacity: 1; 
    }

    .chat-floating-body {
        flex: 1;
        overflow-y: auto;
        background: #ffffff;
        display: flex;
        flex-direction: column;
    }

    /* Conversation List Style */
    .conv-list-item {
        padding: 1.15rem 1.5rem;
        display: flex;
        gap: 1rem;
        align-items: center;
        cursor: pointer;
        transition: all 0.2s;
        border-bottom: 1px solid #f8fafc;
        background: white;
    }

    .conv-list-item:hover { background: #f8fafc; }

    .peer-img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #475569;
        flex-shrink: 0;
        overflow: hidden;
        border: 1px solid #f1f5f9;
    }

    .peer-img img { width: 100%; height: 100%; object-fit: cover; }

    .peer-details { flex: 1; min-width: 0; }
    .peer-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .peer-name { font-weight: 700; color: #0f172a; font-size: 0.95rem; }
    .peer-time { font-size: 0.72rem; color: #94a3b8; font-weight: 500; }
    .peer-msg { font-size: 0.85rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-weight: 500; }

    /* Active Chat Style */
    .active-chat-wrapper { display: flex; flex-direction: column; height: 100%; }
    .active-chat-header {
        padding: 0.75rem 1rem;
        height: 60px;
        background: white;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-shrink: 0;
    }
    .back-to-list { 
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer; 
        color: #64748b; 
        border-radius: 10px;
        transition: background 0.2s;
    }
    .back-to-list:hover { background: #f1f5f9; color: #0f172a; }

    .chat-floating-history {
        flex: 1;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        overflow-y: auto;
        background: #fcfcfd;
    }

    .floating-msg {
        max-width: 82%;
        padding: 0.75rem 1rem;
        border-radius: 1.15rem;
        font-size: 0.9rem;
        line-height: 1.5;
        font-weight: 500;
    }

    .msg-sent {
        align-self: flex-end;
        background: var(--chat-primary);
        color: white;
        border-bottom-right-radius: 0.35rem;
        box-shadow: 0 4px 12px rgba(249, 115, 22, 0.12);
    }

    .msg-received {
        align-self: flex-start;
        background: white;
        color: #1e293b;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        border: 1px solid #f1f5f9;
        border-bottom-left-radius: 0.35rem;
    }

    .chat-floating-footer {
        padding: 1.25rem;
        background: white;
        border-top: 1px solid #f1f5f9;
        flex-shrink: 0;
    }

    .floating-input-box {
        display: flex;
        gap: 0.625rem;
        background: #f8fafc;
        padding: 0.5rem;
        border-radius: 1rem;
        border: 1.5px solid #f1f5f9;
        transition: border-color 0.2s;
    }
    .floating-input-box:focus-within {
        border-color: var(--chat-primary);
        background: #ffffff;
    }

    .floating-input-box input {
        flex: 1;
        border: none;
        background: transparent;
        padding: 0.625rem;
        font-size: 0.9rem;
        outline: none;
        font-weight: 500;
        color: #0f172a;
    }

    .btn-attachment {
        width: 42px;
        height: 42px;
        background: transparent;
        border: none;
        color: #94a3b8;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }

    .btn-attachment:hover {
        background: #f1f5f9;
        color: #475569;
    }

    .btn-floating-send {
        background: var(--chat-secondary);
        color: white;
        border: none;
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .btn-floating-send:active { transform: scale(0.95); }

    /* Empty State Style */
    .chat-empty-state {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem;
        text-align: center;
    }
    .chat-empty-icon {
        width: 72px;
        height: 72px;
        background: #f8fafc;
        color: #cbd5e1;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        margin-bottom: 1.25rem;
    }
    .chat-empty-text {
        color: #94a3b8;
        font-size: 0.92rem;
        font-weight: 600;
        margin: 0;
        line-height: 1.5;
    }

    /* Message Actions */
    .msg-sent-wrapper, .msg-received-wrapper {
        display: flex;
        flex-direction: column;
        max-width: 85%;
        position: relative;
    }
    .msg-sent-wrapper { align-self: flex-end; align-items: flex-end; }
    .msg-received-wrapper { align-self: flex-start; align-items: flex-start; }

    /* Lightbox Modal */
    .chat-lightbox {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 23, 42, 0.95);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        cursor: zoom-out;
        backdrop-filter: blur(8px);
    }
    .chat-lightbox.active { display: flex; animation: chatFadeIn 0.2s; }
    .lightbox-content {
        max-width: 95%;
        max-height: 90%;
        border-radius: 1.25rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    @keyframes chatFadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Mobile Adaptability: Card Centering */
    @media (max-width: 480px) {
        .chat-container-floating {
            width: calc(100% - 32px);
            height: 80vh;
            bottom: auto;
            right: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 1.25rem;
            max-height: 85vh;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .chat-container-floating.active {
            transform: translate(-50%, -50%) scale(1);
            animation: chatMobileSlideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes chatMobileSlideUp {
            from { opacity: 0; transform: translate(-50%, -40%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .floating-chat-trigger {
            bottom: 1.5rem;
            right: 1.5rem;
            width: 56px;
            height: 56px;
        }
    }
</style>

<button class="floating-chat-trigger" id="chatTrigger" title="Quick Messages" type="button">
    <i class="fas fa-comment-dots"></i>
    <div class="chat-unread-badge" id="chatFloatingBadge">0</div>
</button>

<div class="chat-container-floating" id="chatFloatingContainer">
    <div class="chat-floating-header">
        <h3 id="chatHeaderTitle">Messages</h3>
        <div class="close-chat" id="closeFloatingChat">
            <i class="fas fa-times"></i>
        </div>
    </div>

    <div class="chat-floating-body" id="chatFloatingBody">
        <div class="chat-search-bar" id="floatingChatSearch" style="padding: 1rem; border-bottom: 1px solid #f1f5f9; background: white;">
            <div style="position: relative;">
                <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
                <input type="text" id="floatingSearchInput" placeholder="Search conversations..." style="width: 100%; padding: 0.6rem 1rem 0.6rem 2.5rem; border-radius: 99px; border: 1px solid #e2e8f0; font-size: 0.85rem; font-family: inherit; outline: none; background: #f8fafc; transition: all 0.2s;">
            </div>
        </div>
        <div id="floatingConvList" style="width: 100%;">
            <!-- Conversations will be loaded here -->
        </div>
        <div id="floatingActiveChat" style="display: none; height: 100%; flex-direction: column;">
            <div class="active-chat-header">
                <div class="back-to-list" id="backToList" title="Back"><i class="fas fa-chevron-left"></i></div>
                <div class="peer-img" id="floatingActivePeerImg">?</div>
                <div class="peer-name" id="floatingActivePeerName">Name</div>
            </div>
            <div class="chat-floating-history" id="floatingChatHistory">
                <!-- Messages will load here -->
            </div>
            <div class="chat-floating-footer">
                <form id="floatingChatForm" class="floating-input-box">
                    <input type="file" id="chatFileInput" style="display: none;" accept=".jpg,.jpeg,.png,.gif,.pdf,.docx,.txt,.webp">
                    <button type="button" class="btn-attachment" id="attachmentBtn" title="Attach file">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <input type="text" id="floatingMessageInput" placeholder="Write a message..." autocomplete="off">
                    <button type="submit" class="btn-floating-send"><i class="fas fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="chat-lightbox" id="chatLightbox" onclick="this.classList.remove('active')">
    <img src="" class="lightbox-content" id="lightboxImg" alt="Preview">
</div>

<script>
(function() {
    let floatingChatClient;
    let currentFloatingPeerId = null;
    const currentUserId = Number("{{ user.id }}");
    const chatTrigger = document.getElementById('chatTrigger');
    const chatContainer = document.getElementById('chatFloatingContainer');
    const closeBtn = document.getElementById('closeFloatingChat');
    const backBtn = document.getElementById('backToList');

    // Toggle Chat
    chatTrigger.onclick = () => {
        chatContainer.classList.toggle('active');
        if (chatContainer.classList.contains('active')) {
            loadFloatingConversations();
        }
    };

    closeBtn.onclick = () => chatContainer.classList.remove('active');
    
    backBtn.onclick = () => {
        document.getElementById('floatingActiveChat').style.display = 'none';
        document.getElementById('floatingChatSearch').style.display = 'block';
        document.getElementById('floatingConvList').style.display = 'block';
        document.getElementById('chatHeaderTitle').innerText = 'Messages';
        currentFloatingPeerId = null;
        if (floatingChatClient) floatingChatClient.peerId = null;
        loadFloatingConversations();
    };

    // Initialize Chat client immediately (DOM is ready since we are at bottom of body)
    function initFloatingChat() {
        if (typeof OccaChat === 'undefined') {
            // Retry if OccaChat hasn't loaded yet
            setTimeout(initFloatingChat, 100);
            return;
        }
        floatingChatClient = new OccaChat({
            userId: currentUserId,
            userRole: "{{ user.role }}",
            websocketUrl: `ws://${window.location.host}/ws`,
            onMessageReceived: (data) => {
                // Update badge globally
                updateGlobalBadge();
                
                // If the chat container is active and on that peer's conversation
                if (chatContainer.classList.contains('active')) {
                    if (currentFloatingPeerId && data.sender_id === currentFloatingPeerId) {
                        appendFloatingMessage(data, 'received');
                        scrollToFloatingBottom();
                        floatingChatClient.markAllAsRead(currentFloatingPeerId);
                    } else {
                        loadFloatingConversations();
                    }
                }
            },
            onMessageEdited: (data) => {
                const msgEl = document.querySelector(`[data-msg-id="${data.id}"] .msg-content-text`);
                if (msgEl) {
                    msgEl.innerText = data.content;
                    const bubble = msgEl.closest('.floating-msg');
                    if (!bubble.querySelector('.edited-tag')) {
                        bubble.querySelector('.msg-meta-row').insertAdjacentHTML('afterbegin', '<span class="edited-tag">(edited)</span>');
                    }
                }
            },
            onMessageDeleted: (data) => {
                const bubble = document.querySelector(`[data-msg-id="${data.id}"] .floating-msg`);
                if (bubble) {
                    bubble.innerHTML = '<span class="msg-deleted">This message was deleted</span>';
                    bubble.classList.add('msg-deleted-bubble');
                }
            }
        });

        // Initial badge count
        updateGlobalBadge();
        
        // Auto-refresh badge every 2 mins
        setInterval(updateGlobalBadge, 120000);
    }

    // Start initialization
    initFloatingChat();

    async function updateGlobalBadge() {
        try {
            const resp = await fetch('/api/chat/unread-count');
            const data = await resp.json();
            const badge = document.getElementById('chatFloatingBadge');
            const navBadge = document.getElementById('nav-chat-badge');
            
            if (data.count > 0) {
                badge.innerText = data.count;
                badge.style.display = 'flex';
                if (navBadge) {
                    navBadge.innerText = data.count;
                    navBadge.style.display = 'flex';
                }
            } else {
                badge.style.display = 'none';
                if (navBadge) navBadge.style.display = 'none';
            }
        } catch (e) {}
    }

    async function loadFloatingConversations() {
        const listDiv = document.getElementById('floatingConvList');
        listDiv.innerHTML = '<div style="padding: 3rem; text-align:center;"><i class="fas fa-spinner fa-spin"></i></div>';
        
        const conversations = await loadConversations();
        if (conversations.length === 0) {
            listDiv.innerHTML = `
                <div class="chat-empty-state">
                    <div class="chat-empty-icon"><i class="fas fa-comment-slash"></i></div>
                    <p class="chat-empty-text">No conversations yet.</p>
                </div>
            `;
            return;
        // Save loaded conversations globally for search filtering
        window.floatingConversationsData = conversations;
        renderFloatingConversationsList(conversations);
    }

    function renderFloatingConversationsList(conversationsToRender) {
        const listDiv = document.getElementById('floatingConvList');
        if (conversationsToRender.length === 0) {
            listDiv.innerHTML = `
                <div class="chat-empty-state">
                    <div class="chat-empty-icon"><i class="fas fa-comment-slash"></i></div>
                    <p class="chat-empty-text">No conversations found.</p>
                </div>
            `;
            return;
        }

        listDiv.innerHTML = conversationsToRender.map(conv => {
            const time = new Date(conv.last_message.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            return `
                <div class="conv-list-item" onclick="openFloatingActiveChat(${conv.peer.id}, '${conv.peer.name.replace(/'/g, "\\'")}', '${(conv.peer.logo || '').replace(/'/g, "\\'")}')">
                    <div class="peer-img">
                        ${conv.peer.logo ? `<img src="${conv.peer.logo}" alt="Logo">` : conv.peer.name[0]}
                    </div>
                    <div class="peer-details">
                        <div class="peer-top">
                            <span class="peer-name">${conv.peer.name}</span>
                            <span class="peer-time">${time}</span>
                        </div>
                        <div style="display:flex; justify-content: space-between; align-items:center;">
                            <span class="peer-msg">
                                ${conv.last_message.sender_id == currentUserId ? 'You: ' : ''}
                                ${conv.last_message.message_type === 'image' ? '📷 Photo' : 
                                  conv.last_message.message_type === 'file' ? '📄 File' : 
                                  conv.last_message.content}
                            </span>
                            ${conv.unread_count > 0 ? `<span class="unread-badge" style="background: var(--chat-primary); color:white; font-size: 0.65rem; padding: 2px 6px; border-radius:10px;">${conv.unread_count}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Search Logic
    document.getElementById('floatingSearchInput').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        if (!window.floatingConversationsData) return;
        
        const filtered = window.floatingConversationsData.filter(c => 
            c.peer.name.toLowerCase().includes(term)
        );
        renderFloatingConversationsList(filtered);
    });

    window.openFloatingActiveChat = async function(peerId, peerName, peerLogo) {
        currentFloatingPeerId = peerId;
        floatingChatClient.peerId = peerId;
        document.getElementById('floatingChatSearch').style.display = 'none';
        document.getElementById('floatingConvList').style.display = 'none';
        document.getElementById('floatingActiveChat').style.display = 'flex';
        document.getElementById('chatHeaderTitle').innerText = 'Chat with ' + peerName.split(' ')[0];
        
        document.getElementById('floatingActivePeerName').innerText = peerName;
        const peerImgDiv = document.getElementById('floatingActivePeerImg');
        if (peerLogo) peerImgDiv.innerHTML = `<img src="${peerLogo}" alt="Logo">`;
        else peerImgDiv.innerText = peerName[0];

        const historyDiv = document.getElementById('floatingChatHistory');
        historyDiv.innerHTML = '<div style="padding: 2rem; text-align:center;"><i class="fas fa-spinner fa-spin"></i></div>';
        
        const messages = await loadChatHistory(peerId);
        historyDiv.innerHTML = messages.map(msg => renderFloatingMessage(msg, msg.sender_id == currentUserId ? 'sent' : 'received')).join('');
        
        scrollToFloatingBottom();
        await floatingChatClient.markAllAsRead(peerId);
        updateGlobalBadge();
    };

    function renderFloatingMessage(msg, type) {
        const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        let contentHtml = '';

        if (msg.is_deleted) {
            contentHtml = '<span class="msg-deleted">This message was deleted</span>';
        } else if (msg.message_type === 'image') {
            contentHtml = `<div class="msg-image"><img src="${msg.file_url}" alt="Image" onclick="openImagePreview('${msg.file_url}')"></div>`;
        } else if (msg.message_type === 'file') {
            contentHtml = `
                <a href="${msg.file_url}" target="_blank" class="msg-file-box">
                    <div class="msg-file-icon"><i class="fas fa-file-alt"></i></div>
                    <div class="msg-file-info">
                        <span class="msg-file-name">${msg.file_name || 'Attached File'}</span>
                        <span style="font-size: 0.6rem; opacity: 0.7;">Click to download</span>
                    </div>
                </a>
            `;
        } else {
            contentHtml = `<span class="msg-content-text">${msg.content}</span>`;
        }

        const isSelf = msg.sender_id == currentUserId;
        const msgDate = new Date(msg.created_at);
        const ageInMinutes = (new Date() - msgDate) / 60000;
        const canEdit = isSelf && !msg.is_deleted && msg.message_type === 'text' && ageInMinutes < 10;
        const canDelete = isSelf && !msg.is_deleted;

        const actionsHtml = (canEdit || canDelete) ? `
            <div class="msg-actions">
                ${canEdit ? `<button class="action-btn" onclick="startEditMessage(${msg.id}, this)" title="Edit"><i class="fas fa-edit"></i></button>` : ''}
                ${canDelete ? `<button class="action-btn delete" onclick="confirmDeleteMessage(${msg.id})" title="Delete"><i class="fas fa-trash-alt"></i></button>` : ''}
            </div>
        ` : '';

        return `
            <div class="${type == 'sent' ? 'msg-sent-wrapper' : 'msg-received-wrapper'}" data-msg-id="${msg.id}">
                ${actionsHtml}
                <div class="floating-msg ${type == 'sent' ? 'msg-sent' : 'msg-received'} ${msg.message_type === 'image' ? 'msg-image-bubble' : ''} ${msg.is_deleted ? 'msg-deleted-bubble' : ''}">
                    ${contentHtml}
                    <div class="msg-meta-row" style="font-size: 0.6rem; opacity: 0.6; text-align: right; margin-top: 4px; display: flex; align-items: center; justify-content: flex-end;">
                        ${msg.is_edited ? '<span class="edited-tag">(edited)</span>' : ''}
                        ${time}
                    </div>
                </div>
            </div>
        `;
    }

    // Edit Logic
    let editingMsgId = null;

    window.startEditMessage = function(id, btn) {
        const bubble = btn.closest('.msg-sent-wrapper').querySelector('.floating-msg');
        const text = bubble.querySelector('.msg-content-text').innerText;
        
        const input = document.getElementById('floatingMessageInput');
        input.value = text;
        input.focus();
        
        editingMsgId = id;
        document.querySelector('.btn-floating-send i').className = 'fas fa-check';
        input.parentElement.style.border = '2px solid var(--chat-primary)';
    };

    window.confirmDeleteMessage = async function(id) {
        if (!confirm('Are you sure you want to delete this message?')) return;
        
        const res = await floatingChatClient.deleteMessage(id);
        if (res) {
            const wrapper = document.querySelector(`[data-msg-id="${id}"]`);
            const bubble = wrapper.querySelector('.floating-msg');
            bubble.innerHTML = '<span class="msg-deleted">This message was deleted</span>';
            wrapper.querySelector('.msg-actions')?.remove();
        }
    };

    window.openImagePreview = function(url) {
        const lightbox = document.getElementById('chatLightbox');
        const img = document.getElementById('lightboxImg');
        img.src = url;
        lightbox.classList.add('active');
    };

    // Attachment logic
    const attachmentBtn = document.getElementById('attachmentBtn');
    const fileInput = document.getElementById('chatFileInput');

    attachmentBtn.onclick = () => fileInput.click();

    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file || !currentFloatingPeerId) return;

        if (file.size > 5 * 1024 * 1024) {
            if (window.showError) window.showError('File exceeds 5MB limit.');
            else alert('File exceeds 5MB limit.');
            fileInput.value = '';
            return;
        }

        // Visual feedback
        const originalIcon = attachmentBtn.innerHTML;
        attachmentBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        attachmentBtn.disabled = true;

        try {
            const formData = new FormData();
            formData.append('file', file);

            const uploadResp = await fetch('/api/chat/upload', {
                method: 'POST',
                body: formData
            });

            if (!uploadResp.ok) throw new Error('Upload failed');
            const fileData = await uploadResp.json();

            // Send message with file info
            const msg = await floatingChatClient.sendMessage(currentFloatingPeerId, null, {
                message_type: fileData.message_type,
                file_url: fileData.file_url,
                file_name: fileData.file_name
            });

            if (msg) {
                appendFloatingMessage(msg, 'sent');
                scrollToFloatingBottom();
            }
        } catch (err) {
            console.error(err);
            if (window.showError) window.showError('File upload failed: ' + err.message); else alert('File upload failed: ' + err.message);
        } finally {
            attachmentBtn.innerHTML = originalIcon;
            attachmentBtn.disabled = false;
            fileInput.value = ''; // Reset
        }
    };

    document.getElementById('floatingChatForm').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('floatingMessageInput');
        const content = input.value.trim();
        if (!content || !currentFloatingPeerId) return;

        if (editingMsgId) {
            // Edit existing
            const res = await floatingChatClient.editMessage(editingMsgId, content);
            if (res) {
                const bubble = document.querySelector(`[data-msg-id="${editingMsgId}"] .floating-msg`);
                bubble.querySelector('.msg-content-text').innerText = content;
                if (!bubble.querySelector('.edited-tag')) {
                    bubble.querySelector('.msg-meta-row').insertAdjacentHTML('afterbegin', '<span class="edited-tag">(edited)</span>');
                }
            }
            // Reset edit mode
            editingMsgId = null;
            document.querySelector('.btn-floating-send i').className = 'fas fa-paper-plane';
            input.parentElement.style.border = 'none';
            input.value = '';
        } else {
            // Send new
            const msg = await floatingChatClient.sendMessage(currentFloatingPeerId, content);
            if (msg) {
                appendFloatingMessage(msg, 'sent');
                input.value = '';
                scrollToFloatingBottom();
            }
        }
    };

    function appendFloatingMessage(msg, type) {
        const historyDiv = document.getElementById('floatingChatHistory');
        const msgHtml = renderFloatingMessage(msg, type);
        historyDiv.insertAdjacentHTML('beforeend', msgHtml);
    }

    function scrollToFloatingBottom() {
        const div = document.getElementById('floatingChatHistory');
        div.scrollTop = div.scrollHeight;
    }

    // Cleanup on page unload to prevent server hangs during reload
    window.addEventListener('beforeunload', () => {
        if (floatingChatClient && floatingChatClient.socket) {
            // Remove reconnect logic to avoid loops during unload
            floatingChatClient.socket.onclose = null;
            floatingChatClient.socket.close();
        }
    });

})();
</script>
