{% extends "landing_base.html" %}

{% block title %}Payment Successful - OccaServe{% endblock %}

{% block content %}
<div class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card" style="max-width: 500px; width: 100%; text-align: center; padding: 3rem; border-radius: 2rem; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);">
        <div class="success-icon-wrapper" style="margin-bottom: 2rem;">
            <div style="width: 100px; height: 100px; background: #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3); animation: pulse 2s infinite;">
                <i class="fas fa-check" style="font-size: 3rem; color: white;"></i>
            </div>
        </div>
        
        <h1 style="font-weight: 800; color: #1e293b; margin-bottom: 1rem; font-size: 2rem; letter-spacing: -0.025em;">Payment Received!</h1>
        <p style="color: #64748b; line-height: 1.6; margin-bottom: 2.5rem; font-size: 1.1rem;">
            Thank you for choosing OccaServe. Your transaction was successful and your booking has been updated in our system.
        </p>

        <div class="action-buttons" style="display: flex; flex-direction: column; gap: 1rem;">
            <a href="/customer/my-bookings" class="btn-primary" style="padding: 1rem 2rem; border-radius: 1rem; text-decoration: none; font-weight: 700; transition: all 0.3s ease;">
                View My Bookings
            </a>
            <a href="/" style="color: #64748b; text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-top: 1rem; transition: color 0.3s ease;" onmouseover="this.style.color='#1e293b'" onmouseout="this.style.color='#64748b'">
                Return to Home
            </a>
        </div>
    </div>
</div>

<style>
@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.glass-card {
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.btn-primary {
    background: linear-gradient(135deg, #f97316 0%, #ed64a6 100%);
    color: white !important;
    box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.4);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 25px -5px rgba(249, 115, 22, 0.5);
}
</style>
{% endblock %}
