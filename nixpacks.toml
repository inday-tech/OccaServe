[phases.setup]
nixPkgs = ["python310", "tesseract", "libglvnd", "libGL", "glib", "zlib"]

aptPkgs = ["tesseract-ocr", "tesseract-ocr-eng", "libglvnd0", "libglib2.0-0", "libsm6", "libxrender1", "libxext6", "libgomp1"]

[phases.install]
cmds = ["pip install -r OccaShare/requirements.txt"]

[start]
cmd = "cd OccaShare && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 600 --workers 2"
